<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Lab v3</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#20304a;--muted:#5c6779;--line:#d7ddea;--blue:#3157d5;--teal:#138f7b;--cream:#fffdf4;--danger:#a93232;--shadow:0 8px 24px rgba(30,55,90,.08);font-size:16px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Lexend Deca","Lexend",Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{min-height:42px;border:1px solid #ccd5e3;border-radius:11px;background:#fff;color:var(--ink);padding:8px 11px;cursor:pointer;font-weight:650}button:hover{box-shadow:0 3px 10px rgba(0,0,0,.07)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7aa5ff;outline-offset:2px}.active{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}.wrap{max-width:1450px;margin:auto;padding:14px}.top,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.top{padding:15px 18px;margin-bottom:12px}.top h1{margin:0 0 5px;font-size:1.65rem}.sub,.small{color:var(--muted);font-size:.9rem;line-height:1.45}.commonbar{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.commoninner{max-width:1450px;margin:auto;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.context{font-size:.82rem;color:var(--muted);line-height:1.35;max-width:650px}.context strong{color:var(--ink)}.modebar,.actionbar{display:flex;gap:6px;flex-wrap:wrap}.modebar button{font-size:.82rem;min-height:38px}.modetip{max-width:1450px;margin:7px auto 0;padding:0 14px}.modetip>div{background:var(--cream);border:1px solid #eadfae;border-radius:11px;padding:8px 11px;font-size:.84rem;color:#5e552f}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}.panel{padding:14px}.stack{display:grid;gap:11px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}label.cap{display:block;color:var(--muted);font-size:.82rem;font-weight:700;margin-bottom:4px}select,input[type=number],input[type=text],input[type=range]{width:100%}select,input[type=number],input[type=text]{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff}.bubble{background:var(--cream);border:1px solid #eadfae;border-radius:12px;padding:10px 12px;line-height:1.45;font-size:.92rem}.stage{border:1px solid var(--line);border-radius:14px;background:#fbfcff;padding:16px;min-height:360px;overflow:auto}.status{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.chip{background:#eef3ff;color:#2645b3;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:750}.toolbar-group{border-top:1px solid var(--line);padding-top:10px}.hiddenContent{filter:blur(9px);user-select:none}.locked .edit-control{opacity:.45;pointer-events:none}.footer{max-width:1450px;margin:12px auto;padding:0 14px 18px;color:var(--muted);font-size:.78rem}.teacher-actions{display:flex;gap:6px;flex-wrap:wrap}.teacher-actions button{font-size:.8rem;min-height:36px}.fullscreen-stage{position:fixed!important;inset:8px!important;z-index:1000!important;background:#fff!important;max-height:calc(100vh - 16px);overflow:auto;box-shadow:0 0 0 9999px rgba(0,0,0,.4)}.fullscreen-stage .stage{min-height:70vh}.challenge{background:#f5fbf8;border:1px solid #b9e4d6;border-radius:12px;padding:10px 12px;font-size:.9rem}.success{color:#147443;font-weight:800}.warn{color:#8a6500;font-weight:800}.error{color:#9a2929;font-weight:800}
@media(max-width:900px){.grid{grid-template-columns:1fr}.commoninner{align-items:stretch}.context{max-width:none}.modebar{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){:root{font-size:16px}.wrap{padding:9px}.top{padding:13px}.top h1{font-size:1.4rem}.panel{padding:10px}.stage{padding:10px;min-height:260px}.teacher-actions{display:grid;grid-template-columns:repeat(2,1fr)}button{min-height:46px}.actionbar{display:grid;grid-template-columns:repeat(2,1fr);width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

.strip{display:flex;max-width:820px;margin:14px auto;height:70px}.fpart{border:2px solid #33415a;border-right-width:1px;flex:1;display:flex;align-items:center;justify-content:center;font-weight:800}.fpart:last-child{border-right-width:2px}.filled{background:#bfe5dc}.wall{display:grid;gap:5px}.wallrow{display:flex;height:34px}.wallcell{border:1px solid #52627b;display:flex;align-items:center;justify-content:center;font-size:.72rem;background:#edf3ff}.fracline{height:130px;position:relative;margin:30px 20px}.axis{position:absolute;left:3%;right:3%;top:62px;height:3px;background:#33415a}.tick{position:absolute;top:52px;width:2px;height:22px;background:#33415a}.ticklab{position:absolute;top:78px;transform:translateX(-50%);font-size:.72rem}.marker{position:absolute;top:42px;width:16px;height:16px;background:#d9534f;border-radius:50%;transform:translateX(-50%)}.equivGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fracBig{text-align:center;font-size:1.5rem;font-weight:850;margin:8px}.compareResult{text-align:center;font-size:1.15rem;font-weight:800;margin-top:8px}@media(max-width:600px){.equivGrid{grid-template-columns:1fr}}</style></head><body>
<div class="commonbar"><div class="commoninner">
 <div class="context"><strong>Interactive teaching tool</strong><br><span id="ctx">Whole-class modelling, pupil exploration and reasoning.</span></div>
 <div class="modebar" role="group" aria-label="Teaching mode"><button data-mode="teach">Teach</button><button data-mode="explore">Explore</button><button data-mode="challenge">Challenge</button></div>
</div></div><div class="modetip"><div id="modeTip"></div></div>
<div class="wrap"><div class="top"><h1>Fraction Lab <span class="small">v3</span></h1><div class="sub">Explore equal parts, improper fractions, equivalence, comparison and fractions as numbers.</div></div><div class="grid"><aside class="panel"><div class="stack"><div><label class="cap">View</label><select id="view"><option value="strip">Fraction strip</option><option value="compare">Compare two fractions</option><option value="wall">Fraction wall</option><option value="line">Fraction number line</option></select></div><div class="row"><label style="flex:1"><span class="cap">Numerator</span><input id="n1" type="number" min="0" max="24" value="3"></label><label style="flex:1"><span class="cap">Denominator</span><input id="d1" type="number" min="1" max="12" value="4"></label></div><div id="secondFrac" class="row"><label style="flex:1"><span class="cap">Second numerator</span><input id="n2" type="number" min="0" max="24" value="2"></label><label style="flex:1"><span class="cap">Second denominator</span><input id="d2" type="number" min="1" max="12" value="3"></label></div><div class="toolbar-group"><label class="cap">Hide/reveal</label><div class="row"><button id="hideLabels">Hide labels</button><button id="hideShade">Hide shading</button></div></div><div class="teacher-actions toolbar-group"><button id="lock">Freeze</button><button data-fullscreen-for="frMain" onclick="toggleFullscreen('frMain')">Full screen</button><button id="equiv">Equivalent ×2</button><button id="random">Random</button></div><div id="challengeBox" class="challenge" hidden></div></div></aside><main class="panel" id="frMain"><div class="bubble" id="talk"></div><div class="stage" id="frStage"></div></main></div></div><div class="footer">Interactive Maths Tools v3 · school-aligned prototype · single-file HTML</div><script>
const qs=new URLSearchParams(location.search);const year=qs.get('year')||'';const focus=qs.get('focus')||'';
const MODE_TIPS={teach:'<strong>Teach:</strong> model one structural idea at a time. Ask what changes, what stays the same, and why.',explore:'<strong>Explore:</strong> let pupils make or suggest changes, then describe patterns and alternative representations.',challenge:'<strong>Challenge:</strong> hide or vary part of the representation. Ask for a prediction before revealing or checking.'};
let commonMode=qs.get('mode');if(!['teach','explore','challenge'].includes(commonMode)){try{commonMode=localStorage.getItem('imtMode')}catch(e){}}if(!['teach','explore','challenge'].includes(commonMode))commonMode='teach';
function setCommonMode(m){commonMode=m;document.documentElement.dataset.mode=m;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===m);b.setAttribute('aria-pressed',b.dataset.mode===m)});document.getElementById('modeTip').innerHTML=MODE_TIPS[m];try{localStorage.setItem('imtMode',m)}catch(e){}if(typeof onModeChange==='function')onModeChange(m)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setCommonMode(b.dataset.mode));
function setContext(defaultText){document.getElementById('ctx').textContent=(year||focus)?[year,focus].filter(Boolean).join(' · '):defaultText}
function toggleFullscreen(id){const el=document.getElementById(id);el.classList.toggle('fullscreen-stage');const b=document.querySelector('[data-fullscreen-for="'+id+'"]');if(b)b.textContent=el.classList.contains('fullscreen-stage')?'Exit full screen':'Full screen'}


let view=qs.get('view')||(/number line|position|between|order/i.test(focus)?'line':/compare|greater|less/i.test(focus)?'compare':/equivalent/i.test(focus)?'wall':'strip'),hideLabels=false,hideShade=false,locked=false;function val(id,min=0,max=24){let x=Number(document.getElementById(id).value)||min;return Math.max(min,Math.min(max,x))}function gcd(a,b){while(b)[a,b]=[b,a%b];return a||1}function fracStrip(n,d){let wholes=Math.max(1,Math.ceil(n/d));return Array.from({length:wholes},(_,w)=>`<div class="strip">${Array.from({length:d},(_,i)=>`<div class="fpart ${!hideShade&&w*d+i<n?'filled':''}">${hideLabels?'':(w*d+i<n?'1/'+d:'')}</div>`).join('')}</div>`).join('')}function onModeChange(m){document.getElementById('challengeBox').hidden=m!=='challenge';if(m==='challenge'){hideLabels=true}render()}function render(){document.getElementById('view').value=view;document.getElementById('frMain').classList.toggle('locked',locked);document.getElementById('lock').textContent=locked?'Unfreeze':'Freeze';let n1=val('n1'),d1=val('d1',1,12),n2=val('n2'),d2=val('d2',1,12);document.getElementById('secondFrac').style.display=view==='compare'?'flex':'none';let html='';if(view==='strip'){let g=gcd(n1,d1);html=fracStrip(n1,d1)+`<div class="fracBig">${hideLabels?'?':`${n1}/${d1}`}</div><div class="small" style="text-align:center">${g>1?`Equivalent simplest form: ${n1/g}/${d1/g}`:'Already in simplest form'}${n1>d1?` · Mixed number: ${Math.floor(n1/d1)} ${n1%d1}/${d1}`:''}</div>`}else if(view==='compare'){html=`<div class="equivGrid"><div>${fracStrip(n1,d1)}<div class="fracBig">${hideLabels?'?':`${n1}/${d1}`}</div></div><div>${fracStrip(n2,d2)}<div class="fracBig">${hideLabels?'?':`${n2}/${d2}`}</div></div></div><div class="compareResult">${commonMode==='challenge'?'Which is greater?':`${n1/d1===n2/d2?'Equal':n1/d1>n2/d2?`${n1}/${d1} > ${n2}/${d2}`:`${n1}/${d1} < ${n2}/${d2}`}`}</div>`}else if(view==='wall'){html='<div class="wall">'+Array.from({length:12},(_,i)=>{let d=i+1;return `<div class="wallrow">${Array.from({length:d},()=>`<div class="wallcell" style="flex:1">${hideLabels?'':'1/'+d}</div>`).join('')}</div>`}).join('')+'</div>'}else{let max=Math.max(2,Math.ceil(n1/d1)+1),ticks=max*d1;html='<div class="fracline"><div class="axis"></div>'+Array.from({length:ticks+1},(_,i)=>{let p=3+94*i/ticks;return `<span class="tick" style="left:${p}%"></span>${i%d1===0?`<span class="ticklab" style="left:${p}%">${i/d1}</span>`:''}`}).join('')+`<span class="marker" style="left:${3+94*(n1/d1)/max}%"></span></div><div class="fracBig">${hideLabels?'?':`${n1}/${d1}`}</div>`}document.getElementById('frStage').innerHTML=html;document.getElementById('talk').innerHTML='<strong>Teaching prompt:</strong> '+(commonMode==='teach'?'Keep the whole fixed and the parts equal. Name the size of one part before counting how many parts are selected.':commonMode==='explore'?'Change the denominator. What happens to the size of each fractional unit? What remains one whole?':'Predict the fraction, comparison or position before revealing labels. Explain using benchmarks or equivalence.');if(commonMode==='challenge')document.getElementById('challengeBox').innerHTML='<strong>Challenge:</strong> Labels are hidden. Identify or compare the fraction using the structure, then reveal to check.'}
['n1','d1','n2','d2'].forEach(id=>document.getElementById(id).oninput=render);document.getElementById('view').onchange=e=>{view=e.target.value;render()};document.getElementById('hideLabels').onclick=()=>{hideLabels=!hideLabels;document.getElementById('hideLabels').textContent=hideLabels?'Reveal labels':'Hide labels';render()};document.getElementById('hideShade').onclick=()=>{hideShade=!hideShade;document.getElementById('hideShade').textContent=hideShade?'Reveal shading':'Hide shading';render()};document.getElementById('lock').onclick=()=>{locked=!locked;render()};document.getElementById('equiv').onclick=()=>{if(locked)return;document.getElementById('n1').value=n1()*2};function n1(){return val('n1')}document.getElementById('equiv').onclick=()=>{if(locked)return;document.getElementById('n1').value=val('n1')*2;document.getElementById('d1').value=val('d1',1,12)*2;render()};document.getElementById('random').onclick=()=>{if(locked)return;document.getElementById('d1').value=2+Math.floor(Math.random()*9);document.getElementById('n1').value=1+Math.floor(Math.random()*Number(document.getElementById('d1').value)*2);document.getElementById('d2').value=2+Math.floor(Math.random()*9);document.getElementById('n2').value=1+Math.floor(Math.random()*Number(document.getElementById('d2').value));render()};setCommonMode(commonMode);setContext('Explore fractions as equal parts, equivalent quantities and numbers on a number line.');render();
</script></body></html>
