<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Angle & Shape Lab v2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#20304a;--muted:#5c6779;--line:#d7ddea;--accent:#3157d5;--accent2:#0f8d7a;--warm:#a86600;--font:"Lexend Deca","Lexend",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--font);color:var(--ink)}button,input,select{font:inherit}.skip{position:absolute;left:8px;top:-80px;background:#172033;color:#fff;padding:10px;border-radius:8px;z-index:9}.skip:focus{top:8px}.common,.wrap,.foot{max-width:1250px;margin:auto;padding-left:14px;padding-right:14px}.common{padding-top:12px}.bar,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.bar{padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.modes,.actions,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}button{min-height:42px;border:1px solid #cbd5e5;background:#fff;border-radius:10px;padding:8px 11px;color:var(--ink);cursor:pointer}button.active{background:var(--accent);border-color:var(--accent);color:#fff}.context{font-size:.84rem;color:var(--muted)}.tip{margin-top:7px;background:#fffef6;border:1px solid #eadfae;border-radius:11px;padding:9px 11px;font-size:.9rem;line-height:1.45}.wrap{padding-top:14px}.head{padding:17px 19px;margin-bottom:14px}.head h1{margin:0 0 5px;font-size:1.65rem}.grid{display:grid;grid-template-columns:310px 1fr;gap:14px;align-items:start}.panel{padding:15px;min-width:0}.stack{display:grid;gap:11px}label{font-size:.9rem;color:var(--muted)}input[type=range],select{width:100%}.stage{min-height:440px;background:#fbfcff;border:1px solid var(--line);border-radius:13px;padding:14px;display:grid;place-items:center;overflow:auto}.readout{text-align:center;margin-bottom:10px}.big{font-size:1.55rem;font-weight:800}.small{font-size:.88rem;color:var(--muted)}svg{width:min(100%,720px);height:auto;display:block}.ray{stroke:#34425b;stroke-width:8;stroke-linecap:round}.arc{fill:none;stroke:var(--accent);stroke-width:6}.shape{fill:#eef3ff;stroke:#34425b;stroke-width:4}.hidden .degree,.hidden .classification{visibility:hidden}.locked .edit{pointer-events:none;opacity:.55}.challenge{background:#f8fbff;border:1px solid #dbe7ff;border-radius:11px;padding:10px 11px}.foot{font-size:.8rem;color:var(--muted);padding-top:12px;padding-bottom:20px}.shapechips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.chip{background:#eef3ff;border-radius:999px;padding:6px 9px;font-size:.84rem;font-weight:700}.fullscreen-stage{position:fixed;inset:10px;z-index:999;background:#fff;overflow:auto;padding:18px;border:2px solid var(--accent);border-radius:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}@media(max-width:620px){html{font-size:16px}.common,.wrap,.foot{padding-left:10px;padding-right:10px}.bar{align-items:stretch}.modes{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.actions{display:grid;grid-template-columns:repeat(2,1fr)}.actions button{width:100%}.stage{min-height:330px}.head h1{font-size:1.45rem}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><a class="skip" href="#main">Skip to tool</a><div class="common"><div class="bar"><div class="context"><strong>Interactive teaching tool</strong><br><span id="ctx">Angles as turn, size and shape properties</span></div><div class="modes"><button data-mode="teach">Teach</button><button data-mode="explore">Explore</button><button data-mode="challenge">Challenge</button></div></div><div class="tip" id="modeTip"></div></div>
<div class="wrap"><section class="panel head"><h1>Angle & Shape Lab <span class="small">v2</span></h1><div class="small">Make angle size visible without letting arm length distort the idea; connect turns, angle classification and polygon reasoning.</div></section><div class="grid"><aside class="panel"><div class="stack">
<label>View<select id="view" class="edit"><option value="angle">Angle as turn</option><option value="turn">Quarter/half/full turns</option><option value="polygon">Polygon angle explorer</option></select></label>
<label id="angleBox">Angle size <strong id="angleRead">75°</strong><input class="edit" id="angle" type="range" min="5" max="355" step="1" value="75"></label>
<label id="armsBox">Arm length <strong id="armRead">160</strong><input class="edit" id="arms" type="range" min="80" max="230" step="5" value="160"></label>
<label id="polyBox" hidden>Polygon<select id="poly" class="edit"><option value="3">Triangle</option><option value="4">Quadrilateral</option><option value="5">Pentagon</option><option value="6">Hexagon</option><option value="8">Octagon</option></select></label><label id="regBox" hidden>Type<select id="regular" class="edit"><option value="1">Regular (equal sides and angles)</option><option value="0">Irregular (unequal sides and angles)</option></select></label>
<div class="actions"><button id="hide">Hide labels</button><button id="freeze">Freeze</button><button id="new">New example</button><button id="full">Full screen</button></div><div id="challenge" class="challenge" hidden></div></div></aside>
<main class="panel" id="main"><div class="readout"><div class="big classification" id="classification"></div><div class="small degree" id="degree"></div></div><div class="stage" id="stage"></div><div class="tip" id="talk"></div></main></div></div><div class="foot">Interactive Maths Tools · Angle & Shape Lab v2</div>
<script>
const qs=new URLSearchParams(location.search),focus=qs.get('focus')||'',year=qs.get('year')||'';let mode=qs.get('mode')||'teach',hidden=false,locked=false;const tips={teach:'<strong>Teach:</strong> Treat an angle as an amount of turn. Change arm length while keeping the angle fixed so pupils see that arm length does not change angle size.',explore:'<strong>Explore:</strong> Vary the angle and classify it. Compare turns and explain threshold values such as 90°, 180° and 360°.',challenge:'<strong>Challenge:</strong> Hide the angle label. Estimate and classify first, then reveal to check.'};
function cls(a){if(a===90)return'Right angle';if(a===180)return'Straight angle';if(a===360||a===0)return'Complete turn';if(a<90)return'Acute angle';if(a<180)return'Obtuse angle';if(a<360)return'Reflex angle';return'Angle'}
function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.getElementById('modeTip').innerHTML=tips[m];if(m==='challenge')hidden=true;render()}
function point(cx,cy,r,deg){let a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy-r*Math.sin(a)]}
function angleSvg(a,r){const [x2,y2]=point(300,250,r,a),[ax,ay]=point(300,250,70,a);const large=a>180?1:0;return `<svg viewBox="0 0 600 500" role="img" aria-label="Angle diagram"><line class="ray" x1="300" y1="250" x2="${300+r}" y2="250"/><line class="ray" x1="300" y1="250" x2="${x2}" y2="${y2}"/><path class="arc" d="M 370 250 A 70 70 0 ${large} 0 ${ax} ${ay}"/><circle cx="300" cy="250" r="7" fill="#20304a"/></svg>`}
let irregSeed=1;
function polyPoints(n,regular){const cx=300,cy=245,r=180,pts=[];
 /* A deterministic wobble on radius and angle keeps the shape a valid convex
    polygon while making sides and angles visibly unequal. */
 let x=irregSeed;const rnd=()=>{x=(x*9301+49297)%233280;return x/233280};
 const offs=[],rads=[];
 for(let i=0;i<n;i++){offs.push(regular?0:(rnd()-0.5)*(Math.PI/n)*0.9);rads.push(regular?r:r*(0.62+rnd()*0.38))}
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n+offs[i];pts.push([cx+rads[i]*Math.cos(a),cy+rads[i]*Math.sin(a)])}
 return pts}
function interiorAngles(pts){const n=pts.length;return pts.map((p,i)=>{
 const a=pts[(i-1+n)%n],b=pts[(i+1)%n];
 const v1=[a[0]-p[0],a[1]-p[1]],v2=[b[0]-p[0],b[1]-p[1]];
 const d=(v1[0]*v2[0]+v1[1]*v2[1])/(Math.hypot(...v1)*Math.hypot(...v2));
 return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI})}
/* Round the angles so the labels add up to the true sum: rounding each one
   independently can leave the displayed angles a degree off (n-2)*180. */
function roundedAngles(ang){const r=ang.map(a=>Math.round(a));
 let diff=Math.round(ang.reduce((s,a)=>s+a,0))-r.reduce((s,a)=>s+a,0);
 let i=0;while(diff!==0&&i<r.length*3){const k=i%r.length;
  if(diff>0){r[k]++;diff--}else{r[k]--;diff++}i++}
 return r}
function sideLengths(pts){const n=pts.length;return pts.map((p,i)=>{const q=pts[(i+1)%n];return Math.hypot(q[0]-p[0],q[1]-p[1])})}
function polygonSvg(n,regular){const pts=polyPoints(n,regular),p=pts.map(x=>x.join(',')).join(' ');
 const ang=roundedAngles(interiorAngles(pts)),cx=300,cy=245;
 const labels=pts.map((pt,i)=>{const dx=(cx-pt[0]),dy=(cy-pt[1]),L=Math.hypot(dx,dy)||1;
  const lx=pt[0]+dx/L*34,ly=pt[1]+dy/L*34;
  return `<text class="degree" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="17" font-weight="700" fill="#34425b">${ang[i]}°</text>`}).join('');
 return `<svg viewBox="0 0 600 500" role="img" aria-label="${regular?'Regular':'Irregular'} ${n}-sided polygon"><polygon class="shape" points="${p}"/>${labels}</svg>`}
function render(){const v=document.getElementById('view').value,a=Number(document.getElementById('angle').value),r=Number(document.getElementById('arms').value),n=Number(document.getElementById('poly').value);document.getElementById('angleRead').textContent=a+'°';document.getElementById('armRead').textContent=r;document.getElementById('angleBox').hidden=v==='polygon';document.getElementById('armsBox').hidden=v==='polygon'||v==='turn';document.getElementById('polyBox').hidden=v!=='polygon';document.getElementById('regBox').hidden=v!=='polygon';document.getElementById('main').classList.toggle('hidden',hidden);document.body.classList.toggle('locked',locked);document.getElementById('freeze').textContent=locked?'Unfreeze':'Freeze';document.getElementById('hide').textContent=hidden?'Reveal labels':'Hide labels';let html='',label='',deg='';if(v==='polygon'){const regular=document.getElementById('regular').value==='1';
  const pts=polyPoints(n,regular),ang=interiorAngles(pts),sides=sideLengths(pts);
  const eqA=Math.max(...ang)-Math.min(...ang)<0.5,eqS=Math.max(...sides)-Math.min(...sides)<0.5;
  html=polygonSvg(n,regular);
  label=`${regular?'Regular':'Irregular'} ${n}-gon`;
  deg=regular?`Every interior angle = ${((n-2)*180/n).toFixed(((n-2)*180/n)%1?1:0)}° · Sum = ${(n-2)*180}°`
             :`Angles ${roundedAngles(ang).join('°, ')}° · Sum = ${(n-2)*180}° (still)`;
  document.getElementById('talk').innerHTML='<strong>Teaching prompt:</strong> '+(regular
   ?'Equal sides <em>and</em> equal angles. Check both before calling a shape regular, and connect one full turn of exterior angles to 360°.'
   :`Sides are ${eqS?'equal':'unequal'} and angles are ${eqA?'equal':'unequal'}, so this is irregular. The angle sum is unchanged at ${(n-2)*180}° — only the sharing between angles differs.`)}else{let aa=v==='turn'?Math.min(4,Math.max(1,Math.round(a/90)))*90:a;html=angleSvg(aa,v==='turn'?160:r);label=cls(aa);deg=aa+'°';document.getElementById('talk').innerHTML='<strong>Teaching prompt:</strong> '+(mode==='teach'?'Ask which benchmark angle it is close to and why arm length is irrelevant.':mode==='explore'?'Move through 90° and 180°. What changes in the classification, and exactly when?':'Estimate first. Name the angle type and justify against a benchmark before revealing.')}document.getElementById('classification').textContent=label;document.getElementById('degree').textContent=deg;document.getElementById('stage').innerHTML=html;if(mode==='challenge'){document.getElementById('challenge').hidden=false;document.getElementById('challenge').innerHTML='<strong>Challenge:</strong> Estimate/classify before revealing the label.'}else document.getElementById('challenge').hidden=true}
['view','angle','arms','poly','regular'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('hide').onclick=()=>{hidden=!hidden;render()};document.getElementById('freeze').onclick=()=>{locked=!locked;render()};document.getElementById('new').onclick=()=>{if(locked)return;irregSeed=1+Math.floor(Math.random()*99999);document.getElementById('angle').value=15+Math.floor(Math.random()*330);render()};document.getElementById('full').onclick=()=>{document.getElementById('main').classList.toggle('fullscreen-stage');document.getElementById('full').textContent=document.getElementById('main').classList.contains('fullscreen-stage')?'Exit full screen':'Full screen'};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.getElementById('ctx').textContent=(year||focus)?[year,focus].filter(Boolean).join(' · '):'Angles as turn, size and shape properties';const presetView=qs.get('view');if(['angle','turn','polygon'].includes(presetView))document.getElementById('view').value=presetView;else if(/polygon|triangle|quadrilateral|regular|irregular/.test(focus.toLowerCase()))document.getElementById('view').value='polygon';else if(/turn|right angle/.test(focus.toLowerCase()))document.getElementById('view').value='turn';
if(/irregular/.test(focus.toLowerCase()))document.getElementById('regular').value='0';setMode(['teach','explore','challenge'].includes(mode)?mode:'teach');
</script></body></html>
